<!DOCTYPE html>
<html lang="zh-TW">
<head><meta charset="utf-8"><title>trend.js 測試（手動開，不發佈）</title>
<!-- 一定要載入真正的設計系統：刻度的字級／顏色現在由 apple.css 決定，
     不載入就會用瀏覽器預設字級量測，量到的寬度跟正式頁不一樣 -->
<link rel="stylesheet" href="../static/apple.css">
<style>body{background:#111;color:#ddd;font:13px/1.5 monospace;padding:14px}
.ok{color:#2ecc71}.bad{color:#e74c3c}h2{font-size:14px;color:#8ab4f8;margin:18px 0 6px}
#harness{position:absolute;left:-9999px;top:0}</style></head>
<body>
<h2>1) 純函式單元測試（刻度／nice ticks）</h2>
<pre id="unit">running…</pre>
<h2>2) 排版實測（真實 DOM 量測；323px 手機佈局的圖表寬度）</h2>
<pre id="dom">running…</pre>

<div id="harness"></div>
<script type="application/json" id="chart-data"></script>
<script>
/* 測試用的圖表容器＋合成資料，必須在 trend.js 載入前就位。
   寬度說明：手機 323px 時圖表容器寬 = 323 − 頁面左右 8×2? 依階段而異：
     B 階段後（頁面左右 16、卡片內距 16）→ 259px；B 階段前（14/13）→ 269px；390px 手機 → 246px。 */
(function () {
  var WINS = [
    { id: '24h', label: '24 小時', span: 86400, color: '#007AFF', gapReal: 1800, gapEst: 43200 },
    { id: '48h', label: '48 小時', span: 172800, color: '#007AFF', gapReal: 1800, gapEst: 43200 },
    { id: '7d', label: '7 天', span: 604800, color: '#007AFF', gapReal: 1800, gapEst: 43200 },
    { id: '30d', label: '30 天', span: 2592000, color: '#007AFF', gapReal: 1800, gapEst: 43200 }
  ];
  var WIDTHS = [240, 259, 269, 306, 836];              // 240 = 極窄保險
  var html = '', cfg = [];
  WIDTHS.forEach(function (w) {
    WINS.forEach(function (wn) {
      var id = wn.id + '_w' + w;
      html += '<div style="width:' + w + 'px"><div class="chart" data-win="' + id + '"></div></div>';
      cfg.push({ id: id, label: wn.label, span: wn.span, color: wn.color,
                 gapReal: wn.gapReal, gapEst: wn.gapEst, qaWidth: w, qaSpan: wn.id });
    });
  });
  document.getElementById('harness').innerHTML = html;
  window.DD373WINDOWS = cfg;
  window.__QA = { widths: WIDTHS, ids: cfg };

  // 合成資料：實測 3 天（每 15 分，含一筆離群突刺）＋估算 30 天（每 5 小時）
  var now = Math.floor(Date.now() / 1000), real = [], est = [], t, v, i;
  for (t = now - 3 * 86400; t <= now; t += 900) {
    v = Math.round((900 + 40 * Math.sin((t - now) / 86400 * 6.28) + 3 * Math.sin(t / 3600)) * 10) / 10;
    real.push([t, v, v, 0]);
  }
  var spike = now - 30 * 3600;
  for (i = 0; i < real.length; i++) {
    if (real[i][0] === spike) { real[i] = [spike, 800, 800, 1]; }
  }
  for (t = now - 30 * 86400; t < now - 3 * 86400; t += 5 * 3600) {
    est.push([t, Math.round((1500 - (t - (now - 30 * 86400)) / 86400 * 18) * 10) / 10]);
  }
  document.getElementById('chart-data').textContent = JSON.stringify({ now: now, real: real, est: est });
})();
</script>
<script>
/* 測哪一支渲染器？預設測 static/trend.js，可用 ?r=<檔名> 換一支測。
   （一定要在測試程式之前同步載入，所以用 document.write） */
(function () {
  var m = /[?&]r=([\w.\-]+)/.exec(location.search);
  document.write('<script src="../static/' + (m ? m[1] : 'trend.js') + '"><\/script>');
})();
</script>
<script>
var T = window.DD373TREND, log = [], pass = 0, fail = 0;
function ok(name, cond, got) {
  (cond ? pass++ : fail++);
  log.push('<span class="' + (cond ? 'ok' : 'bad') + '">' + (cond ? 'PASS' : 'FAIL') + '</span> ' + name
           + '   got=' + JSON.stringify(got));
}
function eq(name, a, b) { ok(name, JSON.stringify(a) === JSON.stringify(b), a); }
function tp(s) { return Math.floor(new Date(s.replace(' ', 'T') + '+08:00').getTime() / 1000); }
function taipeiHM(t) { return T.fmtFull(t).slice(-5); }
function wd(t) { return new Date((t + 28800) * 1000).getUTCDay(); }        // 0=日、1=一
function allMidnight(ticks) { return ticks.every(function (t) { return taipeiHM(t) === '00:00'; }); }
function allAligned(ticks, step) { return ticks.every(function (t) { return ((t + 28800) % step) === 0; }); }
function overlapInfo(x0, x1, inner) {
  var step = T.chooseStep(x0, x1, inner), plan = T.labelPlan(x0, x1, inner);
  var need = T.maxLabelPx(plan.ticks, step), gap = T.tickGapPx(inner, step, x0, x1);
  return { step: step, n: plan.ticks.length, labeled: plan.labeled.length,
           gap: +gap.toFixed(1), need: +need.toFixed(1), ok: gap >= need || plan.every > 1 };
}

var NOW = tp('2026-10-16 23:13');           // 基準「現在」＝台北 2026-10-16 23:13
var W = { '24h': 86400, '48h': 172800, '7d': 604800, '30d': 2592000 };
var X0 = {};
Object.keys(W).forEach(function (k) { X0[k] = NOW - W[k]; });
var INNER_DESKTOP = 836, INNER_390 = 246, INNER_323 = 177;

log.push('== X 刻度：級距選擇／對齊（台北時間） ==');
var s24 = T.chooseStep(X0['24h'], NOW, INNER_DESKTOP);
eq('桌機 24h 級距＝3h、8 個刻度', [s24, T.ticksFor(X0['24h'], NOW, s24).length], [10800, 8]);
ok('24h 全部對齊整點 (t+8h)%step==0', allAligned(T.ticksFor(X0['24h'], NOW, s24), s24),
   T.ticksFor(X0['24h'], NOW, s24).map(taipeiHM));

var s48 = T.chooseStep(X0['48h'], NOW, INNER_DESKTOP);
eq('桌機 48h 級距＝6h、8 個刻度', [s48, T.ticksFor(X0['48h'], NOW, s48).length], [21600, 8]);

var s7 = T.chooseStep(X0['7d'], NOW, INNER_DESKTOP);
eq('桌機 7d 級距＝1d、7 個刻度', [s7, T.ticksFor(X0['7d'], NOW, s7).length], [86400, 7]);
eq('桌機 7d 刻度＝10/10~10/16 每天 00:00',
   T.ticksFor(X0['7d'], NOW, s7).map(function (t) { return T.fmtFull(t); }),
   ['10/10 00:00', '10/11 00:00', '10/12 00:00', '10/13 00:00', '10/14 00:00', '10/15 00:00', '10/16 00:00']);

var s30 = T.chooseStep(X0['30d'], NOW, INNER_DESKTOP);
eq('桌機 30d 級距＝7d（不被 2d 的 16 個標籤綁走）', s30, 604800);
var k30 = T.ticksFor(X0['30d'], NOW, s30);
ok('30d 每個刻度都是台北時間週一 00:00（A3）',
   k30.every(function (t) { return wd(t) === 1 && taipeiHM(t) === '00:00'; }),
   k30.map(function (t) { return T.fmtFull(t) + ' 週' + wd(t); }));
eq('30d 刻度日期（週一）', k30.map(function (t) { return T.fmtFull(t).slice(0, 5); }),
   ['09/21', '09/28', '10/05', '10/12']);

log.push('');
log.push('== A1：窄螢幕不重疊（323px→容器 177px 內距；390px→246px） ==');
[[INNER_323, '323px'], [INNER_390, '390px']].forEach(function (pair) {
  Object.keys(W).forEach(function (win) {
    var r = overlapInfo(X0[win], NOW, pair[0]);
    ok(pair[1] + ' 窗 ' + win + '：級距 ' + (r.step / 3600) + 'h、間距 ' + r.gap + 'px ≥ 需要 ' + r.need +
       'px、標籤 ' + r.labeled + ' 個', r.ok && r.labeled >= 3, r);
  });
});

log.push('');
log.push('== 文字／數字格式 ==');
eq('刻度標籤：日以上 → M/D', T.tickLabel(tp('2026-10-11 00:00'), 86400), '10/11');
eq('刻度標籤：整點 → HH:MM', T.tickLabel(tp('2026-10-16 03:00'), 10800), '03:00');
eq('刻度標籤：整點跨日 → M/D', T.tickLabel(tp('2026-10-16 00:00'), 10800), '10/16');
eq('數字四捨五入＋千分位（A2）', [T.num(945.5), T.num(863.0), T.num(1716.4)], ['946', '863', '1,716']);

log.push('');
log.push('== Y 軸 nice ticks（1/2/2.5/5 × 10^n、上下 5% padding） ==');
var s1 = T.niceScale(863, 951, 5, 0.05);
eq('niceScale(863,951) step／刻度', [s1.step, s1.ticks], [25, [850, 875, 900, 925, 950, 975]]);
ok('niceScale(863,951) 上下各留 >=5% padding',
   s1.min <= 863 - 88 * 0.05 && s1.max >= 951 + 88 * 0.05, [s1.min, s1.max]);
var s2 = T.niceScale(900, 910, 5, 0.05);
eq('niceScale(900,910)', [s2.step, s2.ticks], [5, [895, 900, 905, 910, 915]]);
var s3 = T.niceScale(1400, 1700, 5, 0.05);
eq('niceScale(1400,1700)', [s3.step, s3.ticks], [100, [1300, 1400, 1500, 1600, 1700, 1800]]);
eq('niceStep 級距 ∈ 1/2/2.5/5×10^n', [0.2, 1.1, 3.3, 24.2, 82.5].map(T.niceStep), [0.2, 2, 5, 25, 100]);
eq('niceStep(2.4) → 2.5', T.niceStep(2.4), 2.5);

log.push('== 漲跌（台股慣例：變大＝紅 ▲、變小＝綠 ▼、0.0% 灰不加箭頭、一律不寫正負號） ==');
var cases = [[2.54, 'up', '▲ 2.5%'], [-0.24, 'down', '▼ 0.2%'], [-2.0, 'down', '▼ 2.0%'],
             [0.04, 'flat', '0.0%'], [-0.04, 'flat', '0.0%'], [0, 'flat', '0.0%']];
cases.forEach(function (c) {
  var r = T.dirPct(c[0]);
  eq('dirPct(' + c[0] + ') → ' + c[1] + ' ' + c[2], [r.cls, r.txt], [c[1], c[2]]);
  ok('dirPct(' + c[0] + ') 不含正負號', !/[+−-]/.test(r.txt), r.txt);
});
eq('dirOf(8.4,0) 差值用整數', (function (d) { return [d.cls, d.arrow, d.a]; })(T.dirOf(8.4, 0)), ['up', '▲', 8]);
eq('dirOf(-7.6,0)', (function (d) { return [d.cls, d.arrow, d.a]; })(T.dirOf(-7.6, 0)), ['down', '▼', 8]);
eq('dirOf(-0.4,0) 進位後為 0 → 灰、無箭頭', (function (d) { return [d.cls, d.arrow, d.a]; })(T.dirOf(-0.4, 0)), ['flat', '', 0]);
eq('dirOf(NaN 之外不炸)', (function (d) { return [d.cls, d.a]; })(T.dirOf(0, 1)), ['flat', 0]);
eq('dirPct(-0.24,false) 括號內不重複箭頭', [T.dirPct(-0.24, false).cls, T.dirPct(-0.24, false).txt], ['down', '0.2%']);
eq('dirPct(2.54,false)', [T.dirPct(2.54, false).cls, T.dirPct(2.54, false).txt], ['up', '2.5%']);
eq('dirPct(0.04,false) 持平仍為 0.0%', T.dirPct(0.04, false).txt, '0.0%');

log.push('== tooltip 掛單量（萬天幣 → 億／萬） ==');
eq('fmtStock(16515) → 1.65 億', T.fmtStock(16515), '1.65 億');
eq('fmtStock(10000) → 1.00 億', T.fmtStock(10000), '1.00 億');
eq('fmtStock(8300) → 8,300 萬', T.fmtStock(8300), '8,300 萬');
eq('fmtStock(null) → null（沒有資料就不顯示那一行）', T.fmtStock(null), null);
eq('薄市場門檻 2 億：19999 是、20000 不是', [T.isThinStock(19999), T.isThinStock(20000)], [true, false]);
eq('isThinStock(null) → false', T.isThinStock(null), false);

log.push('== 掛單量面板：分桶級距／中位數／柱形／口徑分界 ==');
// 分桶：挑「每格寬 ≥ 9px」的最小級距（級距 15分～1天）
eq('桌機 24h（內寬 738、span 86400）→ 30 分', T.chooseStockBucket(738, 86400), 1800);
eq('桌機 48h → 1 時', T.chooseStockBucket(738, 172800), 3600);
eq('桌機 7d → 3 時', T.chooseStockBucket(738, 604800), 10800);
eq('桌機 30d → 12 時', T.chooseStockBucket(738, 2592000), 43200);
eq('手機 24h（內寬 234）→ 1 時', T.chooseStockBucket(234, 86400), 3600);
eq('極窄也一定會回一個級距（不會 undefined）', T.chooseStockBucket(100, 2592000), 86400);
eq('每格寬都 ≥ 9px（桌機 7d）：3 時 →', (738 * 10800 / 604800) >= 9, true);
eq('再小一級就不合格（7d 的 2 時＝8.79px < 9）', (738 * 7200 / 604800) >= 9, false);
eq('中位數：奇數', T.medianOf([3, 1, 2]), 2);
eq('中位數：偶數取中間兩筆平均', T.medianOf([4, 1, 3, 2]), 2.5);
eq('中位數：單筆', T.medianOf([7]), 7);
eq('柱形路徑：左下起、上緣 2px 圓角、底邊平', T.barPath(10, 5, 20, 40),
   'M10.0,40.0 V22.0 Q10.0,20.0 12.0,20.0 H13.0 Q15.0,20.0 15.0,22.0 V40.0 Z');
eq('口徑分界＝台北 2026-10-18 11:07（epoch）', T.STOCK_BREAK, Math.floor(Date.UTC(2026, 9, 18, 3, 7) / 1000));
eq('分桶級距表＝15分～1天共 9 級', T.STOCK_BUCKETS.length, 9);

log.push('== tooltip 文字（時間範圍／最後一行） ==');
var T16 = Math.floor(Date.UTC(2026, 9, 19, 8, 0) / 1000);      // 台北 10/19 16:00
var T20 = Math.floor(Date.UTC(2026, 9, 18, 12, 0) / 1000);     // 台北 10/18 20:00
eq('合併點時間：1 小時段（同一天）', T.ttTimeText({ t: T16, n: 5 }, 3600), '10/19 16:00–17:00');
eq('合併點時間：4 小時段（跨日要寫出日期）', T.ttTimeText({ t: T20, n: 3 }, 14400), '10/18 20:00–10/19 00:00');
eq('一般點時間：絕對時間', T.ttTimeText({ t: T16 }, 0), '10/19 16:00');
eq('一般實測點：沒有最後一行', T.ttTailText({ o: false, src: 'real' }, ''), '');
eq('估算點：只寫估算值', T.ttTailText({ o: false, src: 'est' }, ''), '估算值');
eq('合併點：這 1 小時＋高低', T.ttTailText({ o: false, n: 12, hi: 998, lo: 960, src: 'real' }, '1 小時'),
   '這 1 小時：高 998・低 960');
eq('合併點：這 4 小時', T.ttTailText({ o: false, n: 9, hi: 1012, lo: 970, src: 'real' }, '4 小時'),
   '這 4 小時：高 1,012・低 970');
eq('離群點：線上畫的是平滑值', T.ttTailText({ o: true, v: 899.4, n: 0, src: 'real' }, '1 小時'),
   '離群點・線上畫 899');

document.getElementById('unit').innerHTML = log.join('\n') + '\n<b>' +
  (fail === 0 ? '✅ 單元測試全部通過' : '❌ 單元測試有失敗') + '：' + pass + ' passed, ' + fail + ' failed</b>';

/* ---------- 2) 真實 DOM 量測：相鄰標籤不重疊 ----------
   注意：boot() 綁在 DOMContentLoaded，所以在 load 之後才量（否則圖還沒畫）。 */
window.addEventListener('load', function () {
var dlog = [], dpass = 0, dfail = 0;
function dok(name, cond, got) {
  (cond ? dpass++ : dfail++);
  dlog.push('<span class="' + (cond ? 'ok' : 'bad') + '">' + (cond ? 'PASS' : 'FAIL') + '</span> ' + name
            + '   got=' + JSON.stringify(got));
}
window.__QA.ids.forEach(function (c) {
  var host = document.querySelector('.chart[data-win="' + c.id + '"]');
  var svg = host.querySelector('svg');
  if (!svg) { dok(c.qaSpan + '@' + c.qaWidth + 'px 有畫出 SVG', false, null); return; }
  var labels = [].slice.call(svg.querySelectorAll('text.xtick'));
  var rects = labels.map(function (t) { return t.getBoundingClientRect(); });
  var worst = Infinity;
  for (var i = 1; i < rects.length; i++) worst = Math.min(worst, rects[i].left - rects[i - 1].right);
  dok(c.qaSpan + '@' + c.qaWidth + 'px：標籤 ' + labels.length + ' 個、最小間距 ' +
      (worst === Infinity ? 'n/a' : worst.toFixed(1) + 'px'),
      labels.length >= (c.qaWidth >= 259 ? 3 : 2) && worst >= 1.5, worst);
  if (c.qaSpan === '24h' && c.qaWidth === 836) {
    var badge = svg.querySelector('text.badge-t');
    dok('最新值標籤是整數（無小數點）', !!badge && badge.textContent.indexOf('.') < 0, badge && badge.textContent);
    // 顏色比對要用「解析後」的值：CSS 變數是 #0A84FF，computed style 是 rgb(10, 132, 255)
    function probe(cssVar) {
      var d = document.createElement('span');
      d.style.color = 'var(' + cssVar + ')';
      document.body.appendChild(d);
      var v = getComputedStyle(d).color;
      d.remove();
      return v;
    }
    var lcs = getComputedStyle(svg.querySelector('path.line-real'));
    dok('實測線顏色來自 CSS 變數 --accent、線寬 2px（B：顏色不再寫在 JS）',
        lcs.stroke === probe('--accent') && lcs.strokeWidth === '2px',
        { stroke: lcs.stroke, accent: probe('--accent'), w: lcs.strokeWidth });
    dok('刻度字 11px、格線用 --sep（B：由 CSS 決定）',
        getComputedStyle(svg.querySelector('text.xtick')).fontSize === '11px' &&
        getComputedStyle(svg.querySelector('line.grid')).stroke === probe('--sep'),
        { tick: getComputedStyle(svg.querySelector('text.xtick')).fontSize,
          grid: getComputedStyle(svg.querySelector('line.grid')).stroke, sep: probe('--sep') });
  }
  if (c.qaSpan === '30d' && c.qaWidth === 836) {
    var estp = svg.querySelector('path.line-est');
    dok('估算線＝灰色虛線 1.5px／5 4（B）',
        !!estp && getComputedStyle(estp).strokeDasharray.replace(/ /g, '') === '5px,4px' &&
        getComputedStyle(estp).strokeWidth === '1.5px',
        estp ? { d: getComputedStyle(estp).strokeDasharray, w: getComputedStyle(estp).strokeWidth } : null);
  }
  if (c.qaSpan === '7d' && c.qaWidth === 836) {
    var area = svg.querySelector('path[fill^="url"]');
    var first = st => 0;
    var st = T.charts[c.id];
    var m = area ? /^M([\d.]+),/.exec(area.getAttribute('d')) : null;
    dok('7d 面積填色起點＝第一筆實測（不是左緣）',
        !!m && Math.abs(+m[1] - st.X(st.real[0].t)) < 1.5 && +m[1] > st.pd.l + 20,
        { areaStartX: m && +m[1], firstRealX: st.real.length ? +st.X(st.real[0].t).toFixed(1) : null, plotLeft: st.pd.l });
  }
});
document.getElementById('dom').innerHTML = dlog.join('\n') + '\n<b>' +
  (dfail === 0 ? '✅ 排版實測全部通過' : '❌ 排版實測有失敗') + '：' + dpass + ' passed, ' + dfail + ' failed</b>';
});
</script>
</body>
</html>
